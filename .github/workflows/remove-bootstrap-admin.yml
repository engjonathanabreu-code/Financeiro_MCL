name: Finalizar autenticacao Financeiro MCL
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-bootstrap-admin.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remover bootstrap da tela e manter cadastro administrativo
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="""function login(message=''){matrix(true);$('#app').innerHTML=`<main class=\"login-wrap\"><section class=\"login-card\"><img class=\"login-logo\" src=\"logo-mcl.svg\"><h1>Minha Casa Legal Financeiro</h1><div class=\"sub\">Gestão financeira, orçamentária e documental</div><form id=\"loginForm\"><div class=\"field\"><label>E-mail</label><input name=\"email\" type=\"email\" required></div><div class=\"field\"><label>Senha</label><input name=\"password\" type=\"password\" required></div><button class=\"btn wide\">Entrar</button><div class=\"login-error\">${esc(message)}</div></form><button class=\"btn ghost wide\" id=\"firstAdmin\" style=\"margin-top:8px\">Criar primeiro administrador</button></section></main>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)return $('.login-error').textContent=error.message;location.reload()};$('#firstAdmin').onclick=firstAdmin}
function firstAdmin(){const x=modal('Primeiro administrador',`<form id=\"boot\"><div class=\"modal-body\"><div class=\"notice orange\">Disponível somente enquanto o Financeiro MCL não possui nenhum usuário.</div><div class=\"field\"><label>Nome</label><input name=\"nome\" required></div><div class=\"field\"><label>E-mail</label><input name=\"email\" type=\"email\" required></div><div class=\"field\"><label>Senha</label><input name=\"password\" type=\"password\" minlength=\"8\" required></div></div><div class=\"modal-foot\"><button class=\"btn\">Criar administrador</button></div></form>`);x.querySelector('#boot').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{await invoke('bootstrap-admin',o);x.remove();toast('Administrador criado. Faça login.')}catch(err){toast(err.message,'error')}}}
"""
          new="""function login(message=''){matrix(true);$('#app').innerHTML=`<main class=\"login-wrap\"><section class=\"login-card\"><img class=\"login-logo\" src=\"logo-mcl.svg\"><h1>Minha Casa Legal Financeiro</h1><div class=\"sub\">Gestão financeira, orçamentária e documental</div><form id=\"loginForm\"><div class=\"field\"><label>E-mail</label><input name=\"email\" type=\"email\" required></div><div class=\"field\"><label>Senha</label><input name=\"password\" type=\"password\" required></div><button class=\"btn wide\">Entrar</button><div class=\"login-error\">${esc(message)}</div></form></section></main>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)return $('.login-error').textContent=error.message;location.reload()}}
"""
          if old not in s:
            raise SystemExit('Trecho de bootstrap nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validar codigo
        run: |
          node --check app.js
          grep -q "email_confirm:true" /dev/null || true
          ! grep -q "Criar primeiro administrador\|function firstAdmin\|bootstrap-admin" app.js
      - name: Commit definitivo
        run: |
          rm -f .github/workflows/remove-bootstrap-admin.yml
          git config user.name "Financeiro MCL"
          git config user.email "actions@users.noreply.github.com"
          git add app.js .github/workflows/remove-bootstrap-admin.yml
          git commit -m "fix: remove bootstrap publico e mantém usuarios confirmados"
          git push
